{% set data= load_setup_py_data() %}
package:
    name: ts-gis
    version: {{ data.get('version') }}

source:
    path: ../

build:
    noarch: python
    script: {{PYTHON}} -m pip install --no-deps --ignore-installed .
    string: "py{{ PY_VER | replace('.', '') }}{{ PKG_HASH }}_{{ PKG_BUILDNUM }}"


test:
    requires:
        - ts-xml {{ xml_version }}
        - ts-salobj {{ salobj_version }}
        - ts-conda-build =0.5
    source_files:
        - python
        - bin
        - tests
        - pyproject.toml
    commands:
        - pytest

requirements:
    host:
        - python {{python}}
        - pip
        - setuptools_scm ={{setuptools_scm}}
        - setuptools >={{setuptools}}
    run:
        - python {{python}}
        - ts-salobj
        - ts-xml
        - pymodbus =3.11
        - sshtunnel =0.4
        - paramiko <4
